<p id="status" role="status" aria-live="polite">遊戲規則：你有5個金幣，每扭一次用1個；抽2個問題蛋，抽晒先重新洗牌。</p><p id="progress">第 1 輪 · 已揭曉 0／13 粒</p><section id="card" hidden aria-labelledby="cardTitle"><h2 id="cardTitle">你抽到嘅內容</h2><p id="question"></p><p class="note" id="note"></p></section><footer>#真_人機協作｜獨立扭蛋試版 04<br>冇登入、冇答案儲存、冇音效、冇排行榜。<br>抽題紀錄只保留喺今次開啟嘅頁面；重新整理會重新開始。</footer></main><script>

const entries=[{"key": "a", "color": "#f99ac4", "text": "嗰一幕／嗰一句帶俾你咩感受？點解會記住？", "kind": "question"}, 
{"key": "b", "color": "#b49aef", "text": "睇完之後，你最想再了解邊個人，或者邊段經歷？有邊度覺得未講夠？", "kind": "question"}, 
{"key": "c", "color": "#93d778", "text": "美美嘅經歷或者感受，有冇令你諗起自己？有嘅話，係邊一部分？", "kind": "question"}, 
{"key": "d", "color": "#69b9ee", "text": "佢有冇邊個選擇，係你理解唔到，或者覺得「如果係我，我唔會咁做」？點解？", "kind": "question"}, 
{"key": "e", "color": "#ffc573", "text": "如果有得玩劇本入面嘅「炸橋重建」，你想唔想試？最吸引你，或者令你唔想玩嘅係乜？", "kind": "question"}, 
{"key": "f", "color": "#f6df71", "text": "你覺得呢個 game 同美美嘅經歷有咩關係？有冇邊度睇唔明？", "kind": "question"}, 
{"key": "s1", "color": "#ffffff", "text": "你幫我泊番好架車先", "kind": "story"}, 
{"key": "s2", "color": "#ffffff", "text": "小姐，我幫你報警", "kind": "story"}, 
{"key": "s3", "color": "#ffffff", "text": "北區醫院物理治療室", "kind": "story"}, 
{"key": "s4", "color": "#ffffff", "text": "大埔跌打", "kind": "story"}, 
{"key": "s5", "color": "#ffffff", "text": "大佬山隧道", "kind": "story"}, 
{"key": "s6", "color": "#ffffff", "text": "CDMA電話", "kind": "story"}, 
{"key": "s7", "color": "#ffffff", "text": "劇透，我同黃導嘅對話", "text2": "唔急架，你有錢先拍啦！", "kind": "story"}];

const turn=document.getElementById('turn'),egg=document.getElementById('egg'),card=document.getElementById('card'),st=document.getElementById('status'),knob=document.getElementById('knob'),globe=document.getElementById('globe'),progress=document.getElementById('progress'),coinsEl=document.getElementById('coins');
let coins=5;
entries.forEach((q,i)=>{const ball=document.createElement('i');ball.className='mini'+(q.kind==='story'?' white':'');const col=i%4,row=Math.floor(i/4);ball.style.cssText='--c:'+q.color+';--dx:'+(col<2?22:-22)+'px;--delay:'+(-i*.09)+'s;left:'+(13+col*48)+'px;top:'+(57+row*43)+'px';globe.append(ball)});
function shuffled(){const a=[...entries];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let pool=shuffled(),round=1,revealed=0,chosen=null,rot=0,state='idle';
function updateCoins(){coinsEl.textContent='金幣：'+coins;coinsEl.classList.remove('bump');void coinsEl.offsetWidth;coinsEl.classList.add('bump')}
function updateProgress(){progress.textContent='第 '+round+' 輪 · 已揭曉 '+revealed+'／'+entries.length+' 粒'}
turn.addEventListener('click',()=>{if(state!=='idle')return;if(coins<=0){st.textContent='金幣用完，要再儲。';return}coins--;updateCoins();state='mixing';if(!pool.length){pool=shuffled();round++;revealed=0}turn.disabled=true;card.hidden=true;egg.hidden=true;chosen=pool.pop();updateProgress();

rot+=360;knob.style.transform='rotate('+rot+'deg)';turn.style.transform='rotate('+rot+'deg)';


globe.classList.add('mixing');st.textContent='攪蛋中……';setTimeout(()=>{globe.classList.remove('mixing');egg.style.setProperty('--c',chosen.color);egg.hidden=false;st.textContent='扭蛋跌出嚟喇……';setTimeout(()=>{state='ready';st.textContent='撳一下粒蛋，睇下藏住乜。';egg.focus({preventScroll:true})},850)},1500)});
egg.addEventListener('click',()=>{if(state!=='ready')return;state='idle';egg.hidden=true;revealed++;const story=chosen.kind==='story';card.classList.toggle('story',story);card.style.setProperty('--c',chosen.color);document.getElementById('cardTitle').textContent=story?'白色蛋 · 劇情':'彩色蛋 · 問題 '+chosen.key;const q=document.getElementById('question');q.replaceChildren();if(chosen.key==='a'){const lead=document.createElement('span');lead.textContent='先諗返：你最記得邊一幕／邊一句？';lead.style.cssText='font-size:16px;color:#526d82';q.append(lead,document.createElement('br'),

document.createElement('br'))}q.append(document.createTextNode(chosen.text));

if(chosen.text2)
{q.append(document.createElement('br'),document.createTextNode(chosen.text2));}

document.getElementById('note').textContent=story?'呢粒藏住劇情，唔使答題。想繼續，可以再扭一粒。':'答案請寫喺實體讀後感卡上。冇標準答案，真心分享就得。';card.hidden=false;updateProgress();if(coins<=0){st.textContent='金幣用完，要再儲。'}else{st.textContent='已揭曉！仲有 '+coins+' 個金幣，呢一輪仲有 '+pool.length+' 粒未抽。'}

turn.disabled=false;card.setAttribute('tabindex','-1');card.focus({preventScroll:true});card.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'})});

<script>
(()=>{
'use strict';
if(window.mtsSoundLoaded)return;
window.mtsSoundLoaded=true;
const btn=document.getElementById('mts-sound');
let ctx,master,ambient,on=false,busy=false,drone=[],pulse=null,timers=[];
function init(){
 const Audio=window.AudioContext||window.webkitAudioContext;
 if(!Audio)throw new Error('Audio unsupported');
 if(ctx)return;
 ctx=new Audio();master=ctx.createGain();master.gain.value=.32;
 const limiter=ctx.createDynamicsCompressor();
 master.connect(limiter);limiter.connect(ctx.destination);
 ambient=ctx.createGain();ambient.gain.value=.12;ambient.connect(master);
}
function tone(freq,duration,volume,type='sine',delay=0,endFreq=null){
 if(!on||document.hidden)return;
 const t=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,t);
 if(endFreq)o.frequency.exponentialRampToValueAtTime(endFreq,t+duration);
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(volume,t+.008);
 g.gain.exponentialRampToValueAtTime(.0001,t+duration);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+duration+.03);
 o.onended=()=>{o.disconnect();g.disconnect()};
}
function hiss(){
 const n=Math.floor(ctx.sampleRate*.08),buf=ctx.createBuffer(1,n,ctx.sampleRate),a=buf.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const src=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
 src.buffer=buf;f.type='bandpass';f.frequency.value=1100;g.gain.value=.045;
 src.connect(f);f.connect(g);g.connect(master);src.start();
 src.onended=()=>{src.disconnect();f.disconnect();g.disconnect()};
}
function startAmbient(){
 [65.41,98,130.95].forEach((freq,i)=>{
  const o=ctx.createOscillator(),g=ctx.createGain(),lfo=ctx.createOscillator(),depth=ctx.createGain();
  o.type='sine';o.frequency.value=freq;g.gain.value=.16;
  lfo.frequency.value=.07+i*.027;depth.gain.value=.065;
  lfo.connect(depth);depth.connect(g.gain);o.connect(g);g.connect(ambient);
  o.start();lfo.start();drone.push({o,g,lfo,depth});
 });
 pulse=setInterval(()=>{if(on&&!document.hidden){tone(523.25,1.8,.016,'sine',0,510);tone(784,2,.009,'sine',.3,770)}},8500);
}
function clearEffects(){timers.forEach(clearTimeout);timers=[]}
function stopAmbient(){
 clearInterval(pulse);pulse=null;clearEffects();
 drone.forEach(({o,g,lfo,depth})=>{o.stop();lfo.stop();o.disconnect();g.disconnect();lfo.disconnect();depth.disconnect()});drone=[];
}
function later(fn,ms){timers.push(setTimeout(()=>{if(on&&!document.hidden)fn()},ms))}
btn.addEventListener('click',async()=>{
 if(busy)return;busy=true;
 try{
  init();
  if(on){on=false;stopAmbient();await ctx.suspend()}
  else{await ctx.resume();on=true;startAmbient()}
  btn.textContent=on?'關閉聲音':'開啟聲音';btn.setAttribute('aria-pressed',String(on));
 }catch(e){on=false;stopAmbient();btn.textContent='聲音未能開啟，撳此重試';btn.setAttribute('aria-pressed','false')}
 finally{busy=false}
});
const handle=document.getElementById('turn'),capsule=document.getElementById('egg');
if(handle)handle.addEventListener('click',()=>{
 if(!on||document.hidden||handle.disabled)return;
 if(typeof state==='undefined'||typeof coins==='undefined'||state!=='idle'||coins<=0)return;
 clearEffects();tone(230,.09,.14,'triangle',0,110);hiss();
 for(let i=0;i<13;i++)later(()=>{tone(150+Math.random()*90,.065,.045,'triangle',0,85);hiss()},110+i*100);
 later(()=>{tone(115,.16,.18,'sine',0,48);tone(390,.07,.04,'triangle')},2100);
},true);
if(capsule)capsule.addEventListener('click',()=>{
 if(!on||capsule.hidden||typeof state==='undefined'||state!=='ready')return;
 clearEffects();tone(659.25,.35,.09);tone(987.77,.6,.06,'sine',.09);
},true);
document.addEventListener('visibilitychange',()=>{
 if(!ctx||!on)return;
 if(document.hidden){clearEffects();ctx.suspend().catch(()=>{})}
 else ctx.resume().catch(()=>{});
});
})();
